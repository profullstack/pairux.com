name: Mobile Checks

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/mobile-checks.yml'
      - 'apps/mobile/**'
      - 'packages/shared-types/**'
      - 'patches/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/mobile-checks.yml'
      - 'apps/mobile/**'
      - 'packages/shared-types/**'
      - 'patches/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile app
        run: pnpm check:mobile

      - name: Generate Android native project
        run: pnpm --filter @pairux/mobile exec expo prebuild --platform android --clean --no-install

      - name: Verify Android screen-share native config
        run: pnpm --filter @pairux/mobile verify:android-screen-share
