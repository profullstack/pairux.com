# Deploy the PairUX LiveKit SFU (sfu.pairux.com), which runs on dev2 since it
# left its DigitalOcean droplet on 2026-10-06. The compose file is in
# apps/livekit/dev2/; secrets (livekit.yaml, egress.yaml) live only on the box.
name: Deploy LiveKit SFU Server

on:
  push:
    branches:
      - master
    paths:
      - 'apps/livekit/dev2/**'
      - '.github/workflows/deploy-livekit.yml'
  workflow_dispatch:

concurrency:
  group: deploy-livekit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to dev2
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ${{ }} values go through env, never straight into a run: body.
      - name: Set up ssh
        env:
          SSH_KEY: ${{ secrets.DEV2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEV2_USER: ${{ secrets.DEV2_USER }}
          DEV2_HOST: ${{ secrets.DEV2_HOST }}
        run: |
          dir=/home/anthony/www/sfu.pairux.com
          scp -o BatchMode=yes apps/livekit/dev2/docker-compose.yml "$DEV2_USER@$DEV2_HOST:$dir/docker-compose.yml.new"
          scp -o BatchMode=yes apps/livekit/dev2/deploy.sh "$DEV2_USER@$DEV2_HOST:$dir/deploy.sh"
          ssh -o BatchMode=yes "$DEV2_USER@$DEV2_HOST" "chmod 755 $dir/deploy.sh && $dir/deploy.sh"

      - name: Verify sfu.pairux.com answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://sfu.pairux.com/rtc/validate || true)
            [ "$code" = 401 ] && { echo "sfu.pairux.com signalling up ($code)"; exit 0; }
            echo "attempt $i: $code"; sleep 6
          done
          echo "sfu.pairux.com never answered"; exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
