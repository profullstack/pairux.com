appId: com.pairux.desktop
productName: PairUX
copyright: Copyright 2026 Profullstack, Inc.

directories:
  output: out
  buildResources: resources

# App icon - electron-builder will look for icon.png, icon.icns, icon.ico in buildResources
icon: resources/icon.png

files:
  - dist/**/*
  - resources/**/*
  - '!**/*.map'
  - '!**/node_modules/**/{CHANGELOG.md,README.md,LICENSE*}'

extraResources:
  - from: resources/icons
    to: icons
    filter:
      - '**/*'

asar: true
asarUnpack:
  - '**/*.node'

afterSign: scripts/notarize.cjs

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
        - arm64
  category: Network
  maintainer: Profullstack, Inc.
  artifactName: '${productName}-${version}-${arch}.${ext}'
  executableName: pairux

deb:
  packageName: pairux
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
  # Wayland control helpers (xdg-desktop-portal / ydotool) are intentionally
  # handled as installer/package-manager specific optional dependencies because
  # they vary by compositor and distro package naming.

rpm:
  packageName: pairux
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils

snap:
  confinement: strict
  grade: stable
  summary: Collaborative screen sharing with simultaneous remote control
  plugs:
    - default
    - x11
    - wayland
    - audio-record
    - audio-playback
    - camera
    - network
    - network-bind
    - desktop
    - desktop-legacy
    - opengl
    - home
    - removable-media
    - screen-inhibit-control

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: profullstack
  repo: pairux.com
