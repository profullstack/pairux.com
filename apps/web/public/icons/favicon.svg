<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="32" height="32" fill="#0f172a" rx="3.2"/>

  <!-- Outer ring representing connection -->
  <circle cx="16" cy="16" r="11.2" fill="none" stroke="#3b82f6" stroke-width="1.28"/>

  <!-- Two overlapping circles representing pair/collaboration -->
  <circle cx="12.64" cy="16" r="5.6" fill="#3b82f6" opacity="0.9"/>
  <circle cx="19.36" cy="16" r="5.6" fill="#60a5fa" opacity="0.9"/>

  <!-- Center intersection highlight -->
  <ellipse cx="16" cy="16" rx="2.8" ry="5.04" fill="#93c5fd"/>
</svg>